name: Build Musika APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'musika/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.200'

      - name: Select .NET 9 SDK
        run: |
          dotnet new globaljson --sdk-version 9.0.200 --roll-forward latestPatch
          dotnet --version

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Clean duplicate sources and uploaded build output
        run: rm -rf musika/musika musika/obj musika/bin

      - name: Build APK
        run: dotnet build musika/musika.csproj -f net9.0-android -c Debug -p:TargetFrameworks=net9.0-android -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musika-apk
          path: musika/bin/Debug/net9.0-android/**/*.apk
          if-no-files-found: error
